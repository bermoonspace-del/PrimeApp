<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FD3FF"/>
      <stop offset=".55" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#1A3FA0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="#070B14" stroke="#1E2A47" stroke-width="1.5"/>
  <!-- C из карты: разомкнутое кольцо -->
  <path d="M45 23 C41 17.5 33.5 14.5 26 17.5 C17.5 21 13.5 30.5 16.8 38.5 C20 46.5 29 50.5 37 47.5 C39.5 46.6 41.6 45.2 43.2 43.4"
    fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
  <!-- live-точка = свободный ПК -->
  <circle cx="44" cy="43" r="5" fill="#2F7BFF" filter="url(#glow)"/>
  <circle cx="44" cy="43" r="2" fill="#DCEAFF"/>
  <!-- play внутри = игра -->
  <path d="M27.5 26.5 L36.5 32 L27.5 37.5 Z" fill="#fff" opacity=".95"/>
</svg>
